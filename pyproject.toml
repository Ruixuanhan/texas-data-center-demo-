[project]
name = "texas-data-center-demo"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2,<3.0",
    "SQLAlchemy>=2.0,<3.0",
    "requests>=2.32,<3.0",
    "beautifulsoup4>=4.12,<5.0",
    "openpyxl>=3.1,<4.0",
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/radar"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
